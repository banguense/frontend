<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.37.0/min/vs/loader.js"></script>
</head>
<body class="bg-gray-100">
    <div class="max-w-7xl mx-auto p-4">
        <nav class="border-b mb-6">
            <ul class="flex space-x-8">
                <li><a href="../../" class="py-2 hover:border-b-2 hover:border-blue-500">Início</a></li>
                <li><a href="../resultados/" class="py-2 hover:border-b-2 hover:border-blue-500">Resultados</a></li>
                <li><a href="./" class="py-2 border-b-2 border-blue-500 font-medium">Avançado</a></li>
            </ul>
        </nav>

        <!-- Área de editores, com design responsivo -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
            <div class="bg-white rounded-lg shadow-sm p-4">
                <div id="cEditor" class="h-[calc(90vh-200px)] border rounded"></div>
                <p class="mt-2 text-sm text-gray-600">Código em C</p>
            </div>
            
            <div class="bg-white rounded-lg shadow-sm p-4">
                <div id="makefileEditor" class="h-[calc(90vh-200px)] border rounded"></div>
                <p class="mt-2 text-sm text-gray-600">Makefile</p>
            </div>
        </div>

        <!-- Botão de enviar, centralizado -->
        <div class="flex justify-center mb-6">
            <button id="submitBtn" class="bg-blue-600 text-white px-8 py-3 rounded-lg hover:bg-blue-700 flex items-center">
                <span>Enviar</span>
                <div id="spinner" class="hidden ml-2 w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
            </button>
        </div>
    </div>
    <!-- Script para configurar o Monaco Editor -->
    <script>
        require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.37.0/min/vs' }});

        let cEditor, makefileEditor;

        require(['vs/editor/editor.main'], function() {
            // Criando o editor de código em C
            cEditor = monaco.editor.create(document.getElementById('cEditor'), {
                value: '// Digite seu código em C aqui\n',
                language: 'c',
                theme: 'vs-light',
                minimap: { enabled: false }
            });

            // Criando o editor de Makefile
            makefileEditor = monaco.editor.create(document.getElementById('makefileEditor'), {
                value: '# Digite seu Makefile aqui',
                language: 'shell',
                theme: 'vs-light',
                minimap: { enabled: false }
            });

            // Chama o layout sempre que a janela for redimensionada
            window.addEventListener('resize', function() {
                cEditor.layout();
                makefileEditor.layout();
            });
        });

        // Função para enviar os dados e simular a chamada de API
        document.getElementById('submitBtn').addEventListener('click', async () => {
            const btn = document.getElementById('submitBtn');
            const spinner = document.getElementById('spinner');
            
            btn.disabled = true;
            spinner.classList.remove('hidden');

            try {
                // Simulando uma chamada de API
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                const cCode = cEditor.getValue();
                const makefileCode = makefileEditor.getValue();
                
                console.log('Submitted:', { cCode, makefileCode });
            } catch (error) {
                console.error('Error:', error);
            } finally {
                btn.disabled = false;
                spinner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
