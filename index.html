<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Código</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.37.0/min/vs/loader.js"></script>

</head>
<body class="bg-gray-100">
    <div class="max-w-7xl mx-auto p-4">
        <nav class="border-b mb-6">
            <ul class="flex space-x-8">
                <li><a href="#" class="py-2 border-b-2 border-blue-500 font-medium">Início</a></li>
                <li><a href="./pages/resultados/" class="py-2 hover:border-b-2 hover:border-blue-500">Resultados</a></li>
                <!-- <li><a href="./pages/avancado/" class="py-2 hover:border-b-2 hover:border-blue-500">Avançado</a></li> -->
            </ul>
        </nav>

        <div class="bg-white rounded-lg shadow-sm p-4 h-full min-w-[400px]">
            <div id="editor" class="w-full h-[calc(100vh-200px)] mb-4 border rounded"></div>
            
            <div class="flex items-center justify-between gap-4">
                <div class="flex items-center flex-1">
                    <label class="mr-2 text-sm whitespace-nowrap">Chave de acesso:</label>
                    <input id="accessKey" type="text" class="px-3 py-1 border rounded w-full">
                </div>

                <div class="flex items-center space-x-4">
                    <div class="flex items-center">
                      <label class="mr-2 text-sm">Número de contêineres:</label>
                      <input id="numberOfWorkers" type="number" min="1" value="1" max="15" class="w-20 px-3 py-1 border rounded">
                    </div>

                    <div class="flex items-center">
                      <label class="mr-2 text-sm">Número de processos:</label>
                      <input id="numberOfProcess" type="number" min="1" value="1" max="15" class="w-20 px-3 py-1 border rounded">
                    </div>

                    <button id="submitBtn" class="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600 flex transition-colors">
                      <span>Enviar</span>
                      <div id="spinner" class="hidden ml-2 w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
