<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Código C</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.37.0/min/vs/loader.js"></script>
    <script>
        // Configurar a carga do Monaco Editor corretamente
        require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.37.0/min/vs' }});

        let editor;
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: '// Digite seu código em C aqui\n',
                language: 'c',
                theme: 'vs-light',
                minimap: { enabled: false }
            });

            // Chama o layout sempre que a janela for redimensionada
            window.addEventListener('resize', function() {
                editor.layout();
            });
        });
    </script>
</head>
<body class="bg-gray-100">
    <div class="max-w-7xl mx-auto p-4">
        <nav class="border-b mb-6">
            <ul class="flex space-x-8">
                <li><a href="#" class="py-2 border-b-2 border-blue-500 font-medium">Início</a></li>
                <li><a href="./pages/resultados/" class="py-2 hover:border-b-2 hover:border-blue-500">Resultados</a></li>
                <li><a href="./pages/avancado/" class="py-2 hover:border-b-2 hover:border-blue-500">Avançado</a></li>
            </ul>
        </nav>

        <div class="bg-white rounded-lg shadow-sm p-4 h-full min-w-[400px]">
            <div id="editor" class="w-full h-[calc(100vh-200px)] mb-4 border rounded"></div>
            
            <div class="flex items-center justify-end space-x-4">
                <div class="flex items-center ml-2">
                    <label class="mr-2 text-sm">Número de processos:</label>
                    <input type="number" min="0" value="0" max="5" class="w-20 px-3 py-1 border rounded">
                </div>

                <div class="flex items-center">
                    <label class="mr-2 text-sm">Número de contêineres:</label>
                    <input type="number" min="0" value="0" max="5" class="w-20 px-3 py-1 border rounded">
                </div>

                <button id="submitBtn" class="px-6 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 transition-colors">
                    Enviar
                </button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('submitBtn').addEventListener('click', async () => {
            const btn = document.getElementById('submitBtn');
            const originalText = btn.textContent;
            
            try {
                btn.textContent = 'Enviando...';
                btn.disabled = true;
                
                // Simular envio
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                alert('Código enviado com sucesso!');
            } catch (error) {
                alert('Erro ao enviar código');
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
